<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>항체 설계·평가 매뉴얼</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#fff; --ink:#15181d; --muted:#5d6672;
    --line:#e3e6eb; --accent:#2a6df4; --accent-soft:#eaf1ff;
    --red:#e03131; --red-soft:#fdeceb;
    --green:#1f9254; --green-soft:#e6f6ed;
    --amber:#b7791f; --amber-soft:#fdf3e2;
    --code:#f2f4f7; --radius:10px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Microsoft YaHei","Noto Sans KR","Noto Sans SC",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#14161a; --panel:#1b1e24; --ink:#e8eaee; --muted:#9aa3b0;
    --line:#2b2f37; --accent:#6c9bff; --accent-soft:#1e2a44;
    --red:#f0655c; --red-soft:#331d1b;
    --green:#4ec07f; --green-soft:#17301f;
    --amber:#e0a94a; --amber-soft:#332715; --code:#23272e;}}
  :root[data-theme="dark"]{
    --bg:#14161a; --panel:#1b1e24; --ink:#e8eaee; --muted:#9aa3b0;
    --line:#2b2f37; --accent:#6c9bff; --accent-soft:#1e2a44;
    --red:#f0655c; --red-soft:#331d1b;
    --green:#4ec07f; --green-soft:#17301f;
    --amber:#e0a94a; --amber-soft:#332715; --code:#23272e;}

  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:76px}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.62;-webkit-font-smoothing:antialiased}
  html[lang="ko"] body{word-break:keep-all;overflow-wrap:break-word}
  html[lang="ko"] code{word-break:break-all}
  h1,h2,h3{text-wrap:balance}
  p,li,figcaption{text-wrap:pretty}

  header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--panel) 92%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-inner{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .brand{font-weight:700;font-size:15px;margin-right:auto;display:flex;align-items:center;gap:8px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
  .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 13px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
  .iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
    width:34px;height:34px;cursor:pointer;font-size:15px;line-height:1}
  .menubtn{display:none}

  .wrap{max-width:1240px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:30px;align-items:start}
  nav.side{position:sticky;top:62px;padding:20px 0 40px;max-height:calc(100vh - 62px);overflow:auto}
  nav.side ol{list-style:none;margin:0;padding:0}
  nav.side a{display:block;padding:6px 10px;border-radius:7px;color:var(--muted);text-decoration:none;
    font-size:13.5px;border-left:2px solid transparent}
  nav.side a:hover{background:var(--accent-soft);color:var(--ink)}
  nav.side a.active{color:var(--accent);font-weight:600;background:var(--accent-soft);border-left-color:var(--accent)}
  main{padding:20px 0 110px;min-width:0}

  .hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:22px}
  .hero h1{margin:0 0 8px;font-size:25px;letter-spacing:-.02em}
  .hero p{margin:0;color:var(--muted);font-size:14.5px;max-width:64ch;text-wrap:balance}
  .pipe{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
  .pipe span{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
  .pipe i{color:var(--muted);font-style:normal;align-self:center}

  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin-bottom:20px;scroll-margin-top:70px}
  .snum{display:inline-block;font:600 12px/1 var(--mono);color:var(--accent);background:var(--accent-soft);
    padding:5px 9px;border-radius:6px;margin-bottom:10px}
  section>h2{margin:0 0 6px;font-size:20px;letter-spacing:-.015em}
  section>.lede{color:var(--muted);margin:0 0 18px;font-size:14.5px;text-wrap:balance}
  h3{font-size:15.5px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
  h3::before{content:"";width:3px;height:15px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  p{margin:0 0 12px;font-size:14.5px}
  ul{margin:0 0 14px;padding-left:20px;font-size:14.5px}
  li{margin:4px 0}
  code{font-family:var(--mono);font-size:12.8px;background:var(--code);padding:2px 5px;border-radius:4px}

  /* 주석 스크린샷 + 번호 설명 */
  .shot{margin:0 0 22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code)}
  .shot img{width:100%;display:block}
  .shot .ph{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--muted);text-align:center;padding:26px 18px}
  .shot .ph .key{font:600 12px/1.4 var(--mono);color:var(--accent)}
  .shot .cap{padding:11px 14px;font-size:12.5px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
  ol.legend{list-style:none;margin:0;padding:12px 14px;background:var(--panel);border-top:1px solid var(--line);
    counter-reset:n;font-size:14px}
  ol.legend li{counter-increment:n;position:relative;padding:4px 0 4px 32px;margin:0}
  ol.legend li::before{content:counter(n);position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:50%;
    background:var(--red);color:#fff;font:700 12px/22px var(--sans);text-align:center}
  ol.legend b{font-weight:650}

  /* 결과 플롯 묶음 */
  .gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px;margin:0 0 20px}
  .gal figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);
    display:flex;flex-direction:column}
  .gal img{width:100%;display:block;background:#fff}
  .gal .ph{min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);
    font:600 11.5px var(--mono);padding:16px;text-align:center;background:var(--code)}
  .gal figcaption{padding:9px 11px;font-size:12.5px;border-top:1px solid var(--line)}
  .gal figcaption b{display:block;font-size:13px;margin-bottom:2px}
  .gal figcaption span{color:var(--muted)}

  .tw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:var(--radius)}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  thead th{background:var(--code);font-weight:650;font-size:12.5px;color:var(--muted);white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  td code{white-space:nowrap}
  .g{color:var(--green);font-weight:650}
  .a{color:var(--amber);font-weight:650}
  .r{color:var(--red);font-weight:650}
  .g,.a,.r,.nw{white-space:nowrap}

  .note,.warn,.bad{padding:12px 15px;border-radius:0 var(--radius) var(--radius) 0;margin:0 0 16px;font-size:14px}
  .note{border-left:3px solid var(--accent);background:var(--accent-soft)}
  .warn{border-left:3px solid var(--amber);background:var(--amber-soft)}
  .bad{border-left:3px solid var(--red);background:var(--red-soft)}
  .note p:last-child,.warn p:last-child,.bad p:last-child{margin:0}
  .ttl{display:block;font-weight:700;font-size:12.5px;margin-bottom:3px}

  footer{max-width:1240px;margin:0 auto;padding:0 16px 56px;color:var(--muted);font-size:12.5px;text-align:center}

  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;gap:0}
    nav.side{position:static;max-height:none;padding:14px 0;border-bottom:1px solid var(--line);display:none}
    nav.side.open{display:block}
    .menubtn{display:inline-block}
    .hero,section{padding:20px 17px}
    .hero h1{font-size:21px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <span class="brand"><span class="dot"></span><span id="brand"></span></span>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
      <button type="button" data-lang="zh" aria-pressed="false">中文</button>
    </div>
    <button class="iconbtn" id="theme" type="button" title="Theme">◐</button>
    <button class="iconbtn menubtn" id="menu" type="button" title="Menu">☰</button>
  </div>
</header>

<div class="wrap">
  <nav class="side" id="side"><ol id="toc"></ol></nav>
  <main id="main"></main>
</div>

<footer><p id="foot"></p></footer>

<script>

   본문은 모두 {ko, zh} 쌍으로 이 객체 안에만 있습니다.
   블록 종류: h3 / p / ul / table / note / warn / bad

      zh:'培材大学 · 基于 Curieus 平台 · 2026-11'},
need:{ko:'캡처 필요', zh:'需要截图'},

hero:{
  title:{ko:'항체 설계와 세 가지 평가', zh:'抗体设计与三项评估'},

 blocks:[

    items:{ko:['<b>검색어 입력</b> — <code>rfan</code>처럼 앞 글자만 쳐도 됩니다.',

/* ==================== 1. RFantibody ==================== */
{

  {shot:{id:'03-rfab-framework',

               '<b>프레임워크 템플릿</b> — Opdivo(Nivolumab), Avastin(Bevacizumab), IGHV3-23/IGKV1-39, IGHV3-23/IGKV3-20, Trastuzumab Fv 중에서 고릅니다. 이번 평가에서는 아무 템플릿이나 하나 선택하면 됩니다.',

               '<b>框架类型</b> — 重链轻链两条链选 <code>Antibody</code>，单链选 <code>Nanobody</code>。本次评估选择 <code>Antibody</code>。',

  {warn:{ttl:{ko:'디자인 루프 지정값', zh:'设计环指定值'},

/* =========================== RENDER =========================== */
let LANG = null;
try{ LANG = localStorage.getItem('lang'); }catch(e){}
if(LANG !== 'ko' && LANG !== 'zh')
  LANG = (navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'ko';

const L = s => (s && typeof s === 'object' && !Array.isArray(s)) ? (s[LANG] ?? s.ko) : s;

function shot(b){
  return `<div class="shot" data-fig="${b.id}">
    <img src="images/${b.id}.png" alt="${b.id}" loading="lazy" style="display:none">
    <div class="ph"><div class="key">${b.id}.png</div><div>${L(T.need)}</div></div>
    <ol class="legend">${L(b.items).map(x=>`<li>${x}</li>`).join('')}</ol>
    ${b.cap ? `<div class="cap">${L(b.cap)}</div>` : ''}
  </div>`;
}

function gal(items){
  return `<div class="gal">${items.map(it=>`
    <figure data-fig="${it.id}">
      <img src="images/${it.id}.png" alt="${it.id}" loading="lazy" style="display:none">
      <div class="ph">${it.id}.png</div>
      <figcaption><b>${L(it.t)}</b><span>${L(it.d)}</span></figcaption>
    </figure>`).join('')}</div>`;
}

function block(b){
  if(b.h3)   return `<h3>${L(b.h3)}</h3>`;
  if(b.p)    return `<p>${L(b.p)}</p>`;
  if(b.ul)   return `<ul>${L(b.ul).map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.shot) return shot(b.shot);
  if(b.gal)  return gal(b.gal);
  if(b.table){
    const h = L(b.table.head).map(x=>`<th>${x}</th>`).join('');
    const r = L(b.table.rows).map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
    return `<div class="tw"><table><thead><tr>${h}</tr></thead><tbody>${r}</tbody></table></div>`;
  }
  for(const k of ['note','warn','bad'])
    if(b[k]) return `<div class="${k}"><span class="ttl">${L(b[k].ttl)}</span><p>${L(b[k].body)}</p></div>`;
  return '';
}

function render(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'ko';
  document.title = L(T.brand);
  document.getElementById('brand').innerHTML = `${L(T.brand)}<small>${L(T.brandsub)}</small>`;
  document.getElementById('foot').textContent = L(T.foot);

  let html = `<div class="hero">
    <h1>${L(T.hero.title)}</h1>
    <p>${L(T.hero.lede)}</p>
    <div class="pipe">${L(T.hero.chips).map((c,i)=>(i?'<i>→</i>':'')+`<span>${c}</span>`).join('')}</div>
  </div>`;

  for(const s of T.sections)
    html += `<section id="${s.id}">
      <span class="snum">${s.num}</span>
      <h2>${L(s.h2)}</h2>
      <p class="lede">${L(s.lede)}</p>
      ${s.blocks.map(block).join('')}
    </section>`;

  document.getElementById('main').innerHTML = html;
  document.getElementById('toc').innerHTML =
    T.sections.map(s=>`<li><a href="#${s.id}">${L(s.nav)}</a></li>`).join('');
  document.querySelectorAll('.seg button').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));

  probe(); observe();
}

/* images/<id>.png 가 있으면 자리표시자를 치우고 이미지를 보여준다 */
function probe(){
  document.querySelectorAll('[data-fig]').forEach(f=>{
    const img = f.querySelector('img'), ph = f.querySelector('.ph');
    const p = new Image();
    p.onload = ()=>{ img.style.display='block'; if(ph) ph.remove(); };
    p.src = img.getAttribute('src');
  });
}

let io=null;
function observe(){
  if(io) io.disconnect();
  const links=[...document.querySelectorAll('nav.side a')];
  io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting) links.forEach(a=>
      a.classList.toggle('active', a.getAttribute('href')==='#'+e.target.id));
  }),{rootMargin:'-80px 0px -70% 0px'});
  document.querySelectorAll('section[id]').forEach(s=>io.observe(s));
}

document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  LANG=b.dataset.lang;
  try{ localStorage.setItem('lang',LANG); }catch(e){}
  const y=window.scrollY; render(); window.scrollTo(0,y);
}));
document.getElementById('theme').addEventListener('click',()=>{
  const next = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{ localStorage.setItem('theme',next); }catch(e){}
});
try{ const th=localStorage.getItem('theme'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}
document.getElementById('menu').addEventListener('click',()=>
  document.getElementById('side').classList.toggle('open'));
document.getElementById('side').addEventListener('click',e=>{
  if(e.target.tagName==='A') document.getElementById('side').classList.remove('open');
});

render();
</script>
</body>
</html>
